<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PlateCrop — Account</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="sales.css"></head><body><main class="auth-shell"><section class="auth-card"><a class="brand" href="index.html"><span class="brand-mark"><i></i><i></i><i></i><i></i></span><span>PlateCrop</span></a><div style="margin-top:26px"><span class="plan-chip" id="planChip">Restaurant account</span><h1 id="authTitle">Create your account</h1><p id="authCopy">Create the owner account that will manage your restaurant menu.</p></div><form id="authForm"><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label>Password</label><input id="password" type="password" minlength="6" autocomplete="current-password" required></div><button class="btn primary" id="authSubmit" type="submit">Create account</button></form><button class="btn hidden" id="checkoutBtn" type="button">Continue to secure checkout</button><div class="auth-message" id="authMessage"></div><div class="auth-switch"><span id="switchText">Already have an account?</span> <a href="#" id="switchMode">Sign in</a></div><p style="font-size:12px;margin-top:20px">Payment is handled by Stripe. PlateCrop never stores your card details.</p></section></main><script src="config.js"></script><script src="shared.js"></script><script src="auth.js"></script></body></html>
